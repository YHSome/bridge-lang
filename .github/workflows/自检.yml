name: 自检

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # 三个系统都跑：Windows 上全角标点/OEM 编码最容易出问题，必须有一份
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # macOS 只留最新两个版本，省额度；Linux/Windows 覆盖全版本
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.10'

    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 自检（规则/示例/金标准/边界）
        shell: bash
        run: python 自检.py

      - name: 规则体检
        shell: bash
        run: python 桥.py 体检

      - name: 示例都能编译
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from 转译器 import 编译
          坏 = 0
          for 目录 in ('示例', '教程/示例'):
              for f in sorted(Path(目录).glob('*.bridge')):
                  try:
                      编译(f.read_text(encoding='utf-8-sig'), str(f))
                  except Exception as e:
                      print('FAIL', f, e)
                      坏 += 1
          raise SystemExit(1 if 坏 else 0)
          PY

      - name: 兼容性扫描（最低支持 3.10）
        shell: bash
        run: python 工具/查兼容.py

      - name: 文档与规则同步（落后就失败）
        shell: bash
        run: |
          python 工具/导出AI参考.py
          if ! git diff --quiet; then
            git --no-pager diff --stat
            # 把差异打成 annotation：红了以后不用 logs 权限也能看到差在哪
            echo "::error title=漂移文件::$(git --no-pager diff --stat | tr '\n' '|' | head -c 800)"
            git --no-pager diff -U0 | head -12 | sed 's/^/::error title=diff::/'
            exit 1
          fi
